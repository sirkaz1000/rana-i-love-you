<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d19">
  <meta name="description" content="عالم صغير من مروان إلى رنا، معمول مخصوص عشانك.">
  <title>A Gift For Rana</title>
  <link rel="icon" href="assets/images/site-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="page-loader" id="pageLoader" aria-hidden="true">
    <span class="loader-orbit"><i></i></span>
  </div>

  <div class="ambient" id="ambient" aria-hidden="true">
    <div class="ambient-glow ambient-glow--one"></div>
    <div class="ambient-glow ambient-glow--two"></div>
    <div class="ambient-stars" id="ambientStars"></div>
    <div class="ambient-floaters" id="ambientFloaters"></div>
  </div>

  <div class="reading-progress" id="readingProgress" role="progressbar" aria-label="مدى التقدم في الهدية" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <span id="readingProgressFill"></span>
  </div>

  <section class="entry-screen" id="entryScreen" aria-labelledby="gateTitle">
    <div class="entry-orbit" aria-hidden="true"><span>✦</span></div>
    <div class="entry-card glass-panel">
      <span class="eyebrow entry-eyebrow" data-entry-eyebrow></span>
      <h1 id="gateTitle" data-gate-title></h1>
      <p class="entry-copy" data-gate-description></p>
      <form id="passwordForm" class="password-form" novalidate>
        <label class="visually-hidden" for="passwordInput" data-password-label></label>
        <input id="passwordInput" name="password" type="password" autocomplete="off" required>
        <p class="form-feedback" id="passwordFeedback" role="status" aria-live="polite"></p>
        <button class="button button--primary entry-submit" id="enterButton" type="submit">
          <span data-gate-submit></span><span class="button-glint" aria-hidden="true"></span>
        </button>
      </form>
    </div>
    <span class="entry-footer-mark" aria-hidden="true">✦</span>
  </section>

  <div class="site-shell" id="siteShell" hidden>
    <header class="site-header" id="siteHeader">
      <a class="wordmark" href="#intro" id="wordmarkLink">
        <span class="wordmark-ring" aria-hidden="true"><span>✦</span></span>
        <span class="wordmark-name" data-recipient-name></span>
        <span class="wordmark-heart" aria-hidden="true">♥</span>
      </a>
    </header>

    <main>
      <section class="hero section-anchor" id="intro" aria-labelledby="heroTitle">
        <div class="hero-sky" id="heroSky" aria-hidden="true"><span class="hero-moon"></span><span class="hero-star hero-star--a">✦</span><span class="hero-star hero-star--b">✧</span><span class="hero-star hero-star--c">✦</span></div>
        <div class="hero-copy">
          <p class="hero-kicker reveal" id="heroFirstLine"></p>
          <p class="hero-name-line reveal" id="heroSecondLine"></p>
          <span class="hero-rule reveal" aria-hidden="true"><i></i></span>
          <h1 class="hero-title reveal" id="heroTitle"></h1>
          <p class="hero-description reveal" id="heroDescription"></p>
          <a class="button button--primary hero-cta reveal" href="#gallery" id="journeyButton"><span id="journeyButtonLabel"></span><span class="button-arrow" aria-hidden="true">←</span></a>
        </div>
        <a class="scroll-cue" href="#gallery" id="scrollCue"><span></span></a>
      </section>

      <section class="content-section gallery-section section-anchor" id="gallery" aria-labelledby="galleryTitle">
        <div class="section-heading reveal">
          <h2 id="galleryTitle"></h2>
          <span class="section-ornament" aria-hidden="true">✦</span>
        </div>
        <div class="photo-gallery" id="photoGallery" aria-live="polite"></div>
      </section>

      <section class="content-section qualities-section section-anchor" id="qualities" aria-labelledby="qualitiesTitle">
        <div class="section-heading reveal">
          <h2 id="qualitiesTitle"></h2>
        </div>
        <div class="qualities-grid" id="qualitiesGrid"></div>
      </section>

      <section class="letter-section section-anchor" id="heart-letter" aria-labelledby="heartLetterTitle">
        <div class="letter-halo" aria-hidden="true"></div>
        <div class="letter-side-mark" aria-hidden="true"><span>♥</span></div>
        <article class="heart-letter-card reveal">
          <h2 id="heartLetterTitle"></h2>
          <div class="letter-divider" aria-hidden="true"><span>✦</span></div>
          <div class="heart-letter-copy" id="heartLetterCopy"></div>
          <p class="letter-signature" id="heartLetterSignature"></p>
        </article>
      </section>

      <section class="content-section reasons-section section-anchor" id="reasons" aria-labelledby="reasonsTitle">
        <div class="section-heading reveal">
          <h2 id="reasonsTitle"></h2>
        </div>
        <div class="reasons-stage">
          <div class="reasons-list" id="reasonsList" aria-live="polite"></div>
          <button class="button button--outline discover-button" id="discoverButton" type="button"><span id="discoverButtonLabel"></span><span aria-hidden="true">✦</span></button>
        </div>
      </section>

      <section class="timeline-section section-anchor" id="milestone" aria-labelledby="timelineTitle">
        <div class="timeline-card glass-panel reveal">
          <span class="timeline-orbit" aria-hidden="true"><i>✦</i></span>
          <h2 id="timelineTitle"></h2>
          <p class="timeline-date" id="timelineDate"></p>
          <p class="timeline-description" id="timelineDescription"></p>
          <div class="countdown" id="countdown" aria-label="المدة التي مرت منذ بداية الحكاية"></div>
        </div>
      </section>

      <section class="star-world section-anchor" id="star-world" aria-labelledby="starsTitle">
        <div class="star-world-sky" id="starWorldSky" aria-hidden="true"></div>
        <div class="star-world-content reveal">
          <h2 id="starsTitle"></h2>
          <button class="main-star" id="mainStarButton" type="button" aria-expanded="false"><span aria-hidden="true">✦</span></button>
          <p class="star-message" id="starMessage" hidden></p>
        </div>
      </section>

      <section class="video-section section-anchor" id="video-moment" aria-labelledby="videoTitle">
        <div class="video-card glass-panel reveal">
          <div class="video-heading">
            <span class="video-ornament" aria-hidden="true">✦</span>
            <h2 id="videoTitle"></h2>
          </div>
          <div class="video-frame">
            <video id="giftVideo" controls playsinline preload="metadata" aria-labelledby="videoTitle"></video>
          </div>
        </div>
      </section>

      <section class="world-journey section-anchor" id="world-journey" aria-label="رحلتنا بين البلاد والنجوم">
        <div class="journey-scene" id="journeyScene">
          <div class="journey-map" id="journeyMap" aria-hidden="true">
            <div class="journey-map-canvas">
              <div class="journey-map-zoom" id="journeyMapZoom">
                <svg class="world-map-svg" viewBox="0 0 1000 500" role="img" aria-label="خريطة العالم">
                  <defs>
                    <radialGradient id="mapGlowGradient">
                      <stop offset="0" stop-color="#fff5fb" stop-opacity="1"></stop>
                      <stop offset=".22" stop-color="#ff8bc1" stop-opacity=".78"></stop>
                      <stop offset="1" stop-color="#ff5ca8" stop-opacity="0"></stop>
                    </radialGradient>
                  </defs>
                  <image class="map-atlas" href="assets/images/journey-world-map.svg" x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
                  <image class="map-target-atlas" href="assets/images/journey-targets.svg" x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
                  <g class="map-grid" aria-hidden="true">
                    <path d="M0 95H1000M0 170H1000M0 280H1000M0 390H1000M0 465H1000"></path>
                    <path d="M500 0V500M340 0Q397 250 340 500M660 0Q603 250 660 500M190 0Q292 250 190 500M810 0Q708 250 810 500"></path>
                  </g>
                  <g class="map-pins" aria-hidden="true">

                      <circle class="country-halo" cx="582.1" cy="127.2" r="22"></circle>
                      <circle class="country-pin" id="mapPinTurkey" cx="582.1" cy="127.2" r="3.4"></circle>
                    </g>
                    <g class="map-pin map-pin--syria">
                      <circle class="country-halo" cx="592.8" cy="140.3" r="18"></circle>
                      <circle class="country-pin" id="mapPinSyria" cx="592.8" cy="140.3" r="3"></circle>
                    </g>
                    <g class="map-pin map-pin--egypt">
                      <circle class="country-halo" cx="573.2" cy="167.1" r="21"></circle>
                      <circle class="country-pin" id="mapPinEgypt" cx="573.2" cy="167.1" r="3.4"></circle>
                    </g>
                  </g>
                </svg>
              </div>
            </div>
            <svg class="country-connectors" id="countryConnectors" aria-hidden="true" preserveAspectRatio="none">
              <g class="country-connector country-connector--turkey">
                <path id="countryLineTurkey"></path>
                <circle id="countryLineDotTurkey" r="2.2"></circle>
              </g>
              <g class="country-connector country-connector--syria">
                <path id="countryLineSyria"></path>
                <circle id="countryLineDotSyria" r="2.2"></circle>
              </g>
              <g class="country-connector country-connector--egypt">
                <path id="countryLineEgypt"></path>
                <circle id="countryLineDotEgypt" r="2.2"></circle>
              </g>
            </svg>
            <div class="journey-map-labels">
              <span class="country-label country-label--turkey" id="countryTurkey"></span>
              <span class="country-label country-label--syria" id="countrySyria"></span>
              <span class="country-label country-label--egypt" id="countryEgypt"></span>
            </div>
          </div>

              </button>
              <p class="zodiac-message" id="cancerMessage" role="status" hidden></p>
            </div>

            <div class="envelope-glow" aria-hidden="true"></div>
            <div class="envelope" aria-hidden="true">
              <div class="envelope-back"></div>
              <div class="envelope-letter"><span>♥</span></div>
              <div class="envelope-front"></div>
              <div class="envelope-flap"></div>
              <span class="envelope-seal">✦</span>
            </div>
          </div>

          <article class="secret-paper" id="secretPaper" aria-live="polite" hidden>
            <span class="paper-corner paper-corner--one" aria-hidden="true">✦</span>
            <span class="paper-corner paper-corner--two" aria-hidden="true">✦</span>

      <div class="music-track-copy">
        <span class="music-title" id="musicTitle"></span>
        <span class="music-artist" id="musicArtist"></span>
      </div>
      <span class="music-player-status"><i class="music-dock-indicator" aria-hidden="true"></i><span id="musicStatus" aria-live="polite"></span></span>
    </div>
    <div class="music-progress-row" dir="ltr">
      <span class="music-time" id="musicCurrentTime">0:00</span>
      <input id="musicSeek" class="music-seek" type="range" min="0" max="1000" step="1" value="0" disabled>
      <span class="music-time" id="musicDuration">0:00</span>
    </div>
    <div class="music-controls">
      <button class="music-control-button" id="rewindMusic" type="button"><span aria-hidden="true">−10</span></button>
      <button class="music-control-button music-play-button" id="musicToggle" type="button" aria-pressed="false"><span id="musicToggleIcon" aria-hidden="true">▶</span></button>
      <button class="music-control-button" id="forwardMusic" type="button"><span aria-hidden="true">+10</span></button>
      <label class="music-volume-control">
        <span class="visually-hidden" id="musicVolumeLabel"></span>
        <span aria-hidden="true">♪</span>
        <input id="musicVolume" class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.45">
      </label>
    </div>
  </div>
  <audio id="backgroundMusic" loop preload="none"></audio>

  <dialog class="photo-dialog" id="photoDialog">
    <button class="dialog-close" id="closePhotoDialog" type="button">×</button>
    <img id="expandedPhoto" src="" alt="">
  </dialog>
